# Railway build & deploy configuration.
# Railway detects this file automatically and uses the Dockerfile in the
# repo root for builds. The PORT env var is injected by Railway and read
# by the Go server via internal/config.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/andromeda"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# P1.1: scaled to 2 replicas. Safe because P0.3 (Redis-backed OAuth
# state + auth rate limiter), P0.2 (advisory-locked migrations) and
# P0.4 (leader-elected overage/quota/pricing/applier workers) cover
# the duplication risks. Ramp to 3 after baseline validates — see
# docs/ops/scale-rollout.md.
numReplicas = 2
