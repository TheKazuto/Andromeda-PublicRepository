[package]
name = "andromeda_jwk_registry"
version = "0.1.0"
edition = "2021"
description = "Andromeda JWK Registry — on-chain trust root for OIDC RSA signing keys (Google/Apple) used by the Login Social feature."
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "096c8f7c7c37e373758da8a65b7528cb2230e20e" }
solana-address = { version = "2.2.0", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
