[package]
name = "andromeda_pyth_adapter"
version = "0.1.0"
edition = "2021"
description = "Andromeda Pyth adapter — normalises Pyth PriceUpdateV2 into the canonical 64-byte view consumed by policy-engine KIND_ORACLE."
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "096c8f7c7c37e373758da8a65b7528cb2230e20e" }
solana-address = { version = "2.2.0", features = ["curve25519"] }

# Importante: NÃO usar pyth-solana-receiver-sdk (depende de anchor-lang).
# Parsing manual do PriceUpdateV2 — layout estável, público e travado por
# fixture (`fixtures/pyth/`) + drift tests Rust/Go.

[features]
default = []
# Gates the final mainnet allowlist hardening (compile_error! placeholders).
mainnet = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
