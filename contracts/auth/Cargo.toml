[package]
name = "andromeda_auth"
version = "0.1.0"
edition = "2021"
description = "Shared on-chain auth primitives for Andromeda Quasar policies — challenge construction, member-slot canonical layout, and Solana precompile verification (Ed25519 / Secp256k1 / Secp256r1 / WebAuthn)."
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["lib"]

[features]
default = []
# `host-test` swaps the panicking host-side `hashv` for a real `sha2`-backed
# implementation so host crates (e.g. sbf-tests) can validate canonical
# challenge layouts against shared fixtures. NEVER enable in production SBF
# builds — the Solana runtime ships `sol_sha256` and we want that path.
host-test = ["dep:sha2"]

[dependencies]
solana-address = { version = "2.2.0", features = ["curve25519", "decode"] }
sha2 = { version = "0.10", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
