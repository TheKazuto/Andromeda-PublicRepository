[package]
name = "andromeda_passkey_step_up"
version = "0.1.0"
edition = "2021"
description = "Passkey step-up policy template — requires WebAuthn proof above a threshold."
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "096c8f7c7c37e373758da8a65b7528cb2230e20e" }
ika-dwallet-quasar = { git = "https://github.com/dwallet-labs/ika-pre-alpha", rev = "3bd7945e012950e54fb4d0057b72a7d466556fc1" }
solana-address = { version = "2.2.0", features = ["curve25519"] }
andromeda_auth = { path = "../auth" }
andromeda_policy_shared = { path = "../shared" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
