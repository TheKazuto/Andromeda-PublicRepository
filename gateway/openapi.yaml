    - description: 'Unified policy program (v3): single Quasar program that hosts allowlist / velocity / time-lock / oracle / passkey / fhe-gated / session-key / recovery rules per dWallet.'
      name: policy-engine
    - description: 'Transaction risk advisory (off-chain, opt-in, never blocks): destination scoring + optional EVM/Solana simulation against a client-provided RPC.'
      name: risk
    - description: Public pricing — plans, route costs, estimator.
      name: pricing
    - description: Authenticated user — balance and usage.
      name: me
    - description: Gift card preview, redeem, and Stripe checkout.
      name: gifts
    - description: Subscription checkout, customer portal, overage.
      name: billing
    - description: Per-tenant webhook endpoints + delivery management.
      name: webhooks
    - description: Model Context Protocol over JSON-RPC.
      name: mcp
    - description: Liveness and readiness probes.
      name: health
